name: CI

# Runs on every push and every pull request: if any step fails, the commit shows a red cross on GitHub.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going – saves minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm # caches ~/.npm between runs, keyed by package-lock.json

      # `npm ci` installs exactly what package-lock.json says (reproducible), unlike `npm install`.
      - name: Install dependencies
        run: npm ci

      - name: Prettier (formatting)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      # The build needs no secrets: without Supabase variables the app falls back to placeholders.
      - name: Production build
        run: npm run build
