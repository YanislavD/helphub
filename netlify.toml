# Netlify build settings (the dashboard only needs the two VITE_* environment variables).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: every path (e.g. /articles/vpn-einrichten, /agent) must serve index.html,
# otherwise a reload or a shared link shows Netlify's 404. React Router then renders the page.
# Status 200 = rewrite (the URL stays the same), not a redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Basic security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite puts a content hash into the file names under /assets, so they can be cached "forever".
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
